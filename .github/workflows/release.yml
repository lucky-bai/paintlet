# Cut a Paintlet release: bump the version, build a signed + notarized universal
# DMG, and publish it to GitHub Releases.
#
# Manual only. A release is a decision, not a consequence of merging, so there is
# no push or tag trigger — you press the button when a release is due.
#
# The Mac App Store is deliberately NOT part of this. That track needs two more
# certificates and a provisioning profile that expires yearly, and it ends in a
# review submission that has to be driven through a browser regardless. It stays
# manual via scripts/release-mas.sh; see docs/RELEASING-MAS.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and notarize, but publish nothing (leaves the DMG as a run artifact)"
        type: boolean
        default: true
      version:
        description: "Explicit version, e.g. 0.4.0. Leave blank to bump the patch component."
        type: string
        default: ""

# A second release starting while one is in flight would race on the version
# bump and could push two tags for the same commit. One at a time, and never
# cancel one partway: an interrupted run can leave main bumped but unreleased.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write # push the version bump; create the release and its tag

    steps:
      # A dispatch from the Actions UI delivers `dry_run` as a real boolean, but
      # the REST API and `gh workflow run` deliver the *string* "false" — which
      # is truthy in an Actions expression, so `if: ${{ !inputs.dry_run }}` would
      # publish on a run that asked not to. Normalise it once, here, and let
      # every later step read this output instead of the raw input.
      #
      # Anything that is not exactly "false" resolves to a dry run: the
      # ambiguous case must be the harmless one.
      - name: Resolve the run mode
        id: cfg
        env:
          DRY_RUN_RAW: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN_RAW" == "false" ]]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "Mode: PUBLISH" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "Mode: dry run — nothing will be published" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Full history and tags: bump-version.sh refuses to reuse a version that
      # already has a tag, which it cannot check against a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A real release may only come from main. The repo squash-merges, so a tag
      # cut from a feature branch points at a commit that vanishes from history
      # when the PR lands — v0.1.1 is already tagged at such a commit. A dry run
      # from any branch is fine; it publishes nothing.
      - name: Refuse to publish from a branch
        if: steps.cfg.outputs.dry_run == 'false'
        run: |
          [[ "$GITHUB_REF_NAME" == "main" ]] || {
            echo "::error::Publishing is only allowed from main (this is ${GITHUB_REF_NAME}). Re-run with dry_run to test from a branch."
            exit 1
          }

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The merge gate already ran these, but a release is built from whatever
      # main holds right now, which is not necessarily what any single PR tested.
      - name: Typecheck, build, unit tests
        run: |
          pnpm build
          pnpm test

      # Signing needs the certificate in a keychain that `security find-identity`
      # will search — release.sh detects the identity rather than taking it as a
      # parameter. A throwaway keychain keeps it out of the runner's login
      # keychain and lets the cleanup step below destroy it wholesale.
      - name: Import the Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          # Generated per run and never persisted: nothing outlives the runner,
          # so there is nothing to be gained from making this a secret.
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          # Default keychains re-lock after five minutes of idle; a universal
          # release build plus notarization runs far longer than that, and a
          # locked keychain fails signing partway with an opaque error.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this, the first codesign call blocks on a GUI "allow access
          # to the key?" prompt that no one is there to answer, and the job hangs
          # until it times out rather than failing.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null

          # find-identity only searches the keychains on the search list, so the
          # new one has to join it — prepended, keeping the existing entries.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          security find-identity -v -p codesigning | grep -q 'Developer ID Application' \
            || { echo "::error::No Developer ID Application identity after import"; exit 1; }

      # notarytool authenticates from a keychain profile locally; a fresh runner
      # has no such profile, so release.sh takes an App Store Connect API key
      # through these three variables instead.
      - name: Stage the notary API key
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "NOTARY_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      # Bumping before the build is what makes the DMG, the tag and the binary
      # all report the same version — release.sh reads the version back out of
      # tauri.conf.json to name its output.
      - name: Bump the version
        id: bump
        env:
          # Through the environment rather than interpolated into the script
          # body: `${{ }}` substitutes before the shell parses the line, so a
          # dispatch input containing shell metacharacters would execute rather
          # than be passed as an argument. bump-version.sh validates the shape.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$(scripts/bump-version.sh "$INPUT_VERSION")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Paintlet $VERSION" >> "$GITHUB_STEP_SUMMARY"

      # Pushed before the build, not after, so the tag release.sh creates lands
      # on a commit that is actually on main. The cost of that ordering is that a
      # build failure leaves main bumped with nothing released — which burns a
      # version number and nothing else, since the next run bumps again from
      # there. The reverse ordering would risk a published tag pointing at a
      # commit no one can check out, which is not as cheap to undo.
      - name: Commit the bump to main
        if: steps.cfg.outputs.dry_run == 'false'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git push origin HEAD:main

      # The long one: universal build, sign, notarize (2–10 min inside Apple),
      # staple, Gatekeeper check, and — unless this is a dry run — the GitHub
      # release. Everything here is scripts/release.sh, unchanged from what runs
      # on a laptop; the workflow's whole job is to hand it credentials.
      - name: Build, sign, notarize, publish
        env:
          PUBLISH: ${{ steps.cfg.outputs.dry_run == 'false' && '1' || '0' }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh

      # Uploaded on a dry run too — that is the point of a dry run: a notarized
      # DMG you can download, install, and check Gatekeeper against before any
      # of it is public.
      - name: Upload the DMG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Paintlet-${{ steps.bump.outputs.version }}-macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/Paintlet-macOS.dmg
          if-no-files-found: warn

      # `always()` so a failed or cancelled run does not leave the certificate
      # sitting in a keychain on the runner image.
      - name: Clean up credentials
        if: always()
        run: |
          security delete-keychain "${KEYCHAIN:-$RUNNER_TEMP/build.keychain-db}" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/cert.p12"

      - name: Summary
        if: success()
        env:
          DRY_RUN: ${{ steps.cfg.outputs.dry_run }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run — nothing was published. The notarized DMG is attached to this run." >> "$GITHUB_STEP_SUMMARY"
            echo "The version bump was applied to the working tree only, not committed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published: https://github.com/${{ github.repository }}/releases/tag/v$VERSION" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The Mac App Store build is separate and still manual — bump \`bundleVersion\` in \`src-tauri/tauri.appstore.conf.json\`, then run \`UPLOAD=1 scripts/release-mas.sh\`." >> "$GITHUB_STEP_SUMMARY"
          fi
