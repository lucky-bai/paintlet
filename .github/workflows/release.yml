# Cut a Paintlet release: bump the version, then ship both distribution tracks
# from the same commit — a signed + notarized universal DMG on GitHub Releases,
# and a sandboxed .pkg uploaded to App Store Connect and submitted for review.
#
# Manual only. A release is a decision, not a consequence of merging, so there is
# no push or tag trigger — you press the button when a release is due.
#
# Apple reviews every version of an App Store app, updates included; there is no
# way to skip that and this does not try. What it removes is the human driving
# the submission: creating the version, attaching the build, writing the release
# notes, and sending it to review are all API calls (scripts/asc.mjs). With
# releaseType AFTER_APPROVAL already set on the listing, approval puts it on
# sale with no further action.
name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run builds, notarizes and validates without publishing, uploading or committing"
        type: choice
        options: [dry-run, publish]
        default: dry-run
      tracks:
        description: "Which distribution tracks to ship. app-store-only reuses the committed version instead of bumping."
        type: choice
        options: [both, github-only, app-store-only]
        default: both
      version:
        description: "Explicit version, e.g. 0.4.0. Leave blank to bump the patch component."
        type: string
        default: ""

# A second release starting while one is in flight would race on the version
# bump and could push two tags for the same commit. One at a time, and never
# cancel one partway: an interrupted run can leave the branch bumped but
# unreleased.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    # Both builds are universal, and the App Store half then waits out Apple's
    # build processing before it can submit. The default 360-minute limit is
    # generous, but an unbounded wait on a stuck build should fail rather than
    # burn the day.
    timeout-minutes: 180
    permissions:
      contents: write # push the version bump; create the release and its tag

    steps:
      # Full history and tags: bump-version.sh refuses to reuse a version that
      # already has a tag, and the App Store release notes are generated from
      # the commits since the previous tag. Neither works on a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The merge gate already ran these, but a release is built from whatever
      # main holds right now, which is not necessarily what any single PR tested.
      - name: Typecheck, build, unit tests
        run: |
          pnpm build
          pnpm test

      # Signing needs the certificates in a keychain that `security
      # find-identity` will search — both release scripts detect their identity
      # rather than taking it as a parameter. A throwaway keychain keeps them
      # out of the runner's login keychain and lets the cleanup step below
      # destroy the lot wholesale.
      - name: Create a build keychain
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          # Generated per run and never persisted: nothing outlives the runner,
          # so there is nothing to be gained from making this a secret.
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          # Anything put in GITHUB_ENV is echoed in the env block of every later
          # step's log, and on a public repository those logs are world-readable.
          # The password protects a keychain that exists only on this runner and
          # is deleted before the job ends, so the exposure is inert — but a
          # credential should not be printed regardless. Masking replaces it
          # with *** everywhere Actions writes it.
          echo "::add-mask::$KEYCHAIN_PW"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PW=$KEYCHAIN_PW" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          # Default keychains re-lock after five minutes of idle; two universal
          # builds plus notarization run far longer than that, and a locked
          # keychain fails signing partway with an opaque error.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          # find-identity only searches the keychains on the search list, so the
          # new one has to join it — prepended, keeping the existing entries.
          # shellcheck disable=SC2046 # deliberate word splitting: one argument per keychain
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

      # A .p12 exported from Keychain Access holds the leaf certificate only,
      # and `find-identity -v` lists an identity only if it can build a chain to
      # a trusted root — so without the issuing intermediate a certificate
      # imports fine and then reports "0 valid identities", which the release
      # scripts read as no signing identity at all. Verified locally in an
      # isolated keychain, in both directions. The two tracks chain through
      # different intermediates: Developer ID through the G2 CA, App Store
      # distribution through WWDR G3.
      - name: Install the Apple intermediate certificates
        run: |
          set -euo pipefail
          for url in \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          do
            name="$(basename "$url")"
            curl -fsSL "$url" -o "$RUNNER_TEMP/$name"
            security import "$RUNNER_TEMP/$name" -k "$KEYCHAIN" >/dev/null
            echo "installed $name"
          done

      - name: Import the Developer ID certificate
        if: inputs.tracks != 'app-store-only'
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

      # Two more certificates, because the App Store track signs the .app and
      # the .pkg with different ones. Both are issued under the same Apple
      # account as the Developer ID cert and share its export password.
      - name: Import the App Store distribution certificates
        if: inputs.tracks != 'github-only'
        env:
          DIST_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          INSTALLER_P12_BASE64: ${{ secrets.APPLE_INSTALLER_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "$INSTALLER_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          # productbuild signs the package, so it needs access to the installer
          # key just as codesign needs the application one.
          for f in dist installer; do
            security import "$RUNNER_TEMP/$f.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          done
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/installer.p12"

      # Without this, the first codesign call blocks on a GUI "allow access to
      # the key?" prompt that no one is there to answer, and the job hangs until
      # it times out rather than failing. Done once, after every import.
      - name: Authorize the keys for signing
        env:
          # Through the environment, never interpolated into the script body:
          # `${{ }}` substitutes before the shell parses the line.
          TRACKS: ${{ inputs.tracks }}
        run: |
          set -euo pipefail
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null

          echo "Identities available:"
          security find-identity -v -p codesigning | sed 's/^/  /'

          if [[ "$TRACKS" != "app-store-only" ]]; then
            security find-identity -v -p codesigning | grep -q 'Developer ID Application' \
              || { echo "::error::No Developer ID Application identity after import"; exit 1; }
          fi
          if [[ "$TRACKS" != "github-only" ]]; then
            security find-identity -v -p codesigning | grep -qE 'Apple Distribution|3rd Party Mac Developer Application' \
              || { echo "::error::No Apple Distribution identity after import"; exit 1; }
            security find-certificate -a -c '3rd Party Mac Developer Installer' -Z "$KEYCHAIN" | grep -q alis \
              || security find-certificate -a -c 'Mac Installer Distribution' -Z "$KEYCHAIN" | grep -q alis \
              || { echo "::error::No Mac Installer Distribution certificate after import"; exit 1; }
          fi

      # One App Store Connect API key serves three tools that each find it
      # differently: notarytool takes an explicit path, while altool and
      # asc.mjs search ./private_keys by convention. Staging it at the
      # conventional path inside the workspace satisfies all three at once.
      # The directory is gitignored, so it cannot be committed by accident.
      - name: Stage the App Store Connect API key
        env:
          ASC_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p private_keys
          KEY_PATH="$PWD/private_keys/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          # notarytool is the one that wants a path rather than a convention.
          echo "NOTARY_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      # Gitignored and tied to one Apple account, so it cannot live in the repo
      # — and it expires yearly, which is the one part of this pipeline that
      # will fail on a calendar rather than on a code change.
      - name: Stage the provisioning profile
        if: inputs.tracks != 'github-only'
        env:
          PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$PROFILE_BASE64" | base64 --decode > src-tauri/Paintlet_MAS.provisionprofile
          EXPIRY="$(security cms -D -i src-tauri/Paintlet_MAS.provisionprofile \
            | plutil -extract ExpirationDate raw - )"
          echo "Provisioning profile expires $EXPIRY"
          if [[ "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$EXPIRY" ]]; then
            echo "::error::The provisioning profile expired on $EXPIRY — download a fresh one and update MAS_PROVISIONING_PROFILE_BASE64"
            exit 1
          fi
          # Warn a month out, so the renewal is never discovered mid-release.
          SOON="$(date -u -v+30d +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "$SOON" > "$EXPIRY" ]]; then
            echo "::warning::The provisioning profile expires on $EXPIRY — renew it soon"
          fi

      # Bumping before the build is what makes the DMG, the tag, the .pkg and
      # the binaries all report the same version — both release scripts read the
      # version back out of tauri.conf.json to name their output.
      - name: Resolve the version
        id: version
        env:
          # Through the environment rather than interpolated into the script
          # body: `${{ }}` substitutes before the shell parses the line, so a
          # dispatch input containing shell metacharacters would execute rather
          # than be passed as an argument. bump-version.sh validates the shape.
          INPUT_VERSION: ${{ inputs.version }}
          TRACKS: ${{ inputs.tracks }}
        run: |
          set -euo pipefail
          if [[ "$TRACKS" == "app-store-only" ]]; then
            # No bump. This run exists to finish or retry the App Store half of
            # a release that already shipped its DMG, so it has to build the
            # version that is already committed and tagged.
            VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
            echo "Reusing the committed version $VERSION"
          else
            VERSION="$(scripts/bump-version.sh "$INPUT_VERSION")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Paintlet $VERSION" >> "$GITHUB_STEP_SUMMARY"

      # Chosen here rather than inside release-mas.sh so it can be committed
      # together with the version bump, in one commit, before anything is built.
      - name: Choose the App Store build number
        if: inputs.tracks != 'github-only'
        id: build
        env:
          APPLE_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          set -euo pipefail
          BUILD="$(node scripts/asc.mjs set-build-number)"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "App Store build number: $BUILD" >> "$GITHUB_STEP_SUMMARY"

      # Pushed before the build, so the tag release.sh creates points at a
      # commit that exists on the branch rather than at an uncommitted working
      # tree. A build failure then leaves the branch bumped with nothing
      # released, which costs a version number and nothing else — the next run
      # bumps again from there.
      - name: Commit the version and build number
        if: inputs.mode == 'publish'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.build.outputs.build }}
          TRACKS: ${{ inputs.tracks }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Scoped to the files that carry a version, so a staged credential or
          # build artifact could never ride along.
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml \
            src-tauri/Cargo.lock src-tauri/tauri.appstore.conf.json
          if git diff --cached --quiet; then
            echo "Nothing to commit — the version and build number are already recorded."
          else
            if [[ "$TRACKS" == "app-store-only" ]]; then
              git commit -m "Set the App Store build number to $BUILD"
            else
              git commit -m "Release v$VERSION"
            fi
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      # The long one: universal build, sign, notarize (2–10 min inside Apple),
      # staple, Gatekeeper check, and — unless this is a dry run — the GitHub
      # release. Everything here is scripts/release.sh, unchanged from what runs
      # on a laptop; the workflow's whole job is to hand it credentials.
      - name: GitHub track — build, sign, notarize, publish
        if: inputs.tracks != 'app-store-only'
        env:
          PUBLISH: ${{ inputs.mode == 'publish' && '1' || '0' }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh

      # Both release scripts start by clearing the bundle directory they build
      # into, and they build into the same one — so the App Store build would
      # delete the DMG before it could be uploaded as an artifact. Copy it out
      # first. `always()` so a DMG that was built before a later failure is
      # still collectable.
      - name: Stash the DMG
        if: always() && inputs.tracks != 'app-store-only'
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/Paintlet-macOS.dmg \
            "$RUNNER_TEMP/artifacts/" 2>/dev/null || echo "No DMG to stash"

      # The second universal build, this time sandboxed and signed for
      # distribution. On a dry run it still packages and — because the runners
      # ship full Xcode, so altool is present — runs a real `--validate-app`
      # against App Store Connect. That is a stronger pre-flight than a
      # Transporter-only Mac can manage locally.
      - name: App Store track — build, package, upload, submit
        if: inputs.tracks != 'github-only'
        env:
          UPLOAD: ${{ inputs.mode == 'publish' && '1' || '0' }}
          SUBMIT: ${{ inputs.mode == 'publish' && '1' || '0' }}
          BUILD_NUMBER: ${{ steps.build.outputs.build }}
          APPLE_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: scripts/release-mas.sh

      - name: Stash the App Store package
        if: always() && inputs.tracks != 'github-only'
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          cp src-tauri/target/universal-apple-darwin/release/bundle/macos/Paintlet_*.pkg \
            "$RUNNER_TEMP/artifacts/" 2>/dev/null || echo "No package to stash"

      # Uploaded on a dry run too — that is the point of a dry run: a notarized
      # DMG and a validated package you can inspect before any of it is public.
      - name: Upload the artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Paintlet-${{ steps.version.outputs.version }}-macOS
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: warn

      # `always()` so a failed or cancelled run does not leave certificates or a
      # private key sitting on the runner.
      - name: Clean up credentials
        if: always()
        run: |
          security delete-keychain "${KEYCHAIN:-$RUNNER_TEMP/build.keychain-db}" 2>/dev/null || true
          rm -rf private_keys src-tauri/Paintlet_MAS.provisionprofile
          rm -f "$RUNNER_TEMP"/*.p12

      - name: Summary
        if: success()
        env:
          MODE: ${{ inputs.mode }}
          TRACKS: ${{ inputs.tracks }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.build.outputs.build }}
        run: |
          {
            if [[ "$MODE" != "publish" ]]; then
              echo "Dry run — nothing was published, uploaded or committed."
              echo ""
              echo "The version bump was applied to the working tree only. The notarized DMG"
              echo "and the validated App Store package are attached to this run."
            else
              if [[ "$TRACKS" != "app-store-only" ]]; then
                echo "- GitHub: https://github.com/${{ github.repository }}/releases/tag/v$VERSION"
              fi
              if [[ "$TRACKS" != "github-only" ]]; then
                echo "- App Store: version $VERSION (build $BUILD) submitted for review."
                echo "  Apple reviews every version, usually within a day. It goes on sale"
                echo "  automatically on approval."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
